[package]
name = "psync"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "psync — rsync-compatible local file synchronizer with parallel transfer, live progress bars and pybackupsync-compatible YAML config mode"
license = "MIT"
readme = "README.md"
keywords = ["rsync", "backup", "sync", "parallel", "progress"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "psync"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
signal-hook = "0.3"
terminal_size = "0.4"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
